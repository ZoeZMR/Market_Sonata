services:
  - type: web
    name: market-sonata
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Optional: add ANTHROPIC_API_KEY in the Render dashboard to enable the
      # LLM-polished analyst. Without it the rule-based narration is used.
